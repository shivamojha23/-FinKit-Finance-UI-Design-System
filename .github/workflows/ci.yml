name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx nx run-many --targets=lint

      - name: Type-check
        run: npx nx run-many --targets=typecheck

      - name: Test
        run: npx nx run-many --targets=test

      - name: Build
        run: npx nx run-many --targets=build

      - name: Knip (unused code)
        run: npx knip

      - name: Lighthouse CI
        if: github.event_name == 'push'
        run: |
          npm install -g @lhci/cli
          npx nx run docs:build
          lhci autorun --config=lighthouserc.json || true
